version: '3.8'

services:
  api:
    build: ./src/server
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mvpdb
      POSTGRES_USER: mvpuser
      POSTGRES_PASSWORD: mvppass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./src/client/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - client

  client:
    build: ./src/client
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE=http://localhost:5000
    depends_on:
      - api

volumes:
  postgres_data:
